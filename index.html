
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>factoryFL</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17191f;color:#ddd;font-family:Arial,sans-serif}
header{height:55px;background:#20232b;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #343943}
.logo{font-size:20px;font-weight:bold;color:#fff}
.logo span{color:#65d98a}
button{border:0;border-radius:6px;padding:10px 16px;font-weight:bold;cursor:pointer}
#play{background:#38c96b;color:#102b19;font-size:16px}
main{display:flex;height:calc(100vh - 55px)}
aside{width:55px;background:#20232b;display:flex;align-items:center;flex-direction:column;padding-top:20px;gap:25px;color:#aaa;font-size:22px}
.workspace{flex:1;display:flex;flex-direction:column;min-width:0}
.tab{height:40px;background:#252932;padding:12px;font-size:13px}
.editor{flex:1;min-height:180px;padding:15px;overflow:auto}
textarea{width:100%;height:100%;min-height:250px;resize:none;background:transparent;color:#a9e6b9;border:0;outline:0;font:15px monospace;line-height:1.7}
.terminal{height:160px;background:#111319;border-top:1px solid #383d47;padding:12px;font:13px monospace;overflow:auto}
.terminal-title{color:#aaa;margin-bottom:12px}
#output{white-space:pre-wrap;color:#b9e8c4}
.status{color:#777;margin-top:10px}
@media(max-width:500px){aside{width:40px}.terminal{height:135px}}
</style>
</head>
<body>
<header>
 <div class="logo">factory<span>FL</span></div>
 <button id="play" onclick="runFL()">▶ Play</button>
</header>
<main>
 <aside>
  <span>▤</span><span>⌕</span><span>⚙</span>
 </aside>
 <section class="workspace">
  <div class="tab">● main.fl</div>
  <div class="editor">
<textarea id="code" spellcheck="false"><Fl2play!] = on the FL

__2
L1_say("Hello from Fast Language!")_

end.</textarea>
  </div>
  <div class="terminal">
   <div class="terminal-title">TERMINAL · FL ENGINE</div>
   <div id="output">factoryFL iniciado.
Aguardando execução...</div>
   <div class="status" id="status">READY</div>
  </div>
 </section>
</main>
<script>
function runFL(){
 const source=document.getElementById("code").value;
 const output=document.getElementById("output");
 const status=document.getElementById("status");
 output.textContent="";
 status.textContent="RUNNING";
 let foundEnd=false;
 for(const line of source.split(/\r?\n/)){
  if(line.trim()==="end."){
   foundEnd=true;
   break;
  }
  const match=line.match(/_say\("([\s\S]*)"\)_/);
  if(match) output.textContent+=match[1]+"\n";
 }
 if(!foundEnd){
  output.textContent+="FL Error: end. não encontrado.";
  status.textContent="ERROR";
 }else{
  if(!output.textContent) output.textContent="Programa executado.";
  status.textContent="FINISHED";
 }
}
</script>
</body>
</html>
